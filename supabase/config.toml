project_id = "go-digital-marketing-crm"

# Public provider/callback boundaries perform their own one-time-state,
# challenge, anti-spoofing-key or HMAC verification. Supabase gateway JWT
# verification must be disabled only for these named functions.
[functions.integration-oauth-callback]
verify_jwt = false

[functions.provider-webhook-meta]
verify_jwt = false

[functions.provider-webhook-whatsapp]
verify_jwt = false

[functions.provider-webhook-generic]
verify_jwt = false

[functions.provider-webhook-twilio]
verify_jwt = false

[functions.mobile-link-exchange]
verify_jwt = false

# User-initiated functions stay behind gateway JWT verification in addition to
# their internal user, permission, scope and payload checks.
[functions.credit-consume]
verify_jwt = true

[functions.call-provider-start]
verify_jwt = true

[functions.dashboard-cache]
verify_jwt = true

